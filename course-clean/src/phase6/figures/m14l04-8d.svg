<svg viewBox='0 0 900 330' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Eight disciplines D1 team, D2 problem description, D3 containment, D4 root cause for occurrence and detection, D5 corrective action, D6 validation, D7 prevention, D8 closure, with the usual failure points marked'><style>text{font-family:'IBM Plex Mono',monospace;fill:#e2e8f0}.d{fill:#94a3b8}.t{fill:#53d1cc}.r{fill:#f44336}.o{fill:#ff9800}</style>
<rect x='20' y='40' width='100' height='70' rx='6' fill='none' stroke='#53d1cc' stroke-width='1.5'/><text x='70' y='62' font-size='14' text-anchor='middle' fill='#53d1cc'>D1</text><text x='70' y='80' font-size='10' text-anchor='middle'>team</text><text x='70' y='96' font-size='9' class='d' text-anchor='middle'>who decides</text>
<rect x='128' y='40' width='100' height='70' rx='6' fill='none' stroke='#53d1cc' stroke-width='1.5'/><text x='178' y='62' font-size='14' text-anchor='middle' fill='#53d1cc'>D2</text><text x='178' y='80' font-size='10' text-anchor='middle'>problem</text><text x='178' y='96' font-size='9' class='d' text-anchor='middle'>facts, not cause</text>
<rect x='236' y='40' width='100' height='70' rx='6' fill='none' stroke='#f44336' stroke-width='1.5'/><text x='286' y='62' font-size='14' text-anchor='middle' fill='#f44336'>D3</text><text x='286' y='80' font-size='10' text-anchor='middle'>containment</text><text x='286' y='96' font-size='9' class='d' text-anchor='middle'>protect customer</text>
<rect x='344' y='40' width='100' height='70' rx='6' fill='none' stroke='#f44336' stroke-width='1.5'/><text x='394' y='62' font-size='14' text-anchor='middle' fill='#f44336'>D4</text><text x='394' y='80' font-size='10' text-anchor='middle'>root cause</text><text x='394' y='96' font-size='9' class='d' text-anchor='middle'>occur + detect</text>
<rect x='452' y='40' width='100' height='70' rx='6' fill='none' stroke='#53d1cc' stroke-width='1.5'/><text x='502' y='62' font-size='14' text-anchor='middle' fill='#53d1cc'>D5</text><text x='502' y='80' font-size='10' text-anchor='middle'>corrective</text><text x='502' y='96' font-size='9' class='d' text-anchor='middle'>on proven cause</text>
<rect x='560' y='40' width='100' height='70' rx='6' fill='none' stroke='#53d1cc' stroke-width='1.5'/><text x='610' y='62' font-size='14' text-anchor='middle' fill='#53d1cc'>D6</text><text x='610' y='80' font-size='10' text-anchor='middle'>validation</text><text x='610' y='96' font-size='9' class='d' text-anchor='middle'>metric moved</text>
<rect x='668' y='40' width='100' height='70' rx='6' fill='none' stroke='#53d1cc' stroke-width='1.5'/><text x='718' y='62' font-size='14' text-anchor='middle' fill='#53d1cc'>D7</text><text x='718' y='80' font-size='10' text-anchor='middle'>prevention</text><text x='718' y='96' font-size='9' class='d' text-anchor='middle'>system updated</text>
<rect x='776' y='40' width='100' height='70' rx='6' fill='none' stroke='#f44336' stroke-width='1.5'/><text x='826' y='62' font-size='14' text-anchor='middle' fill='#f44336'>D8</text><text x='826' y='80' font-size='10' text-anchor='middle'>closure</text><text x='826' y='96' font-size='9' class='d' text-anchor='middle'>with evidence</text>
<text x='20' y='150' font-size='12' class='r'>WHERE 8D REPORTS FAIL</text>
<text x='20' y='175' font-size='11'>D3 → containment presented as correction (it reduces risk, it does not remove the cause)</text>
<text x='20' y='195' font-size='11'>D4 → root cause stated without data; detection escape ignored (why did it ship?)</text>
<text x='20' y='215' font-size='11'>D5-D7 → no owner, no date, vague language, no horizontal deployment to similar lines</text>
<text x='20' y='235' font-size='11'>D8 → closed without an effectiveness metric or traceability to the records</text>
<rect x='20' y='255' width='860' height='1' fill='#334155'/>
<text x='20' y='280' font-size='11' class='t'>auditable 8D = what was found · what was done · who · when · what the data said afterwards</text>
<text x='20' y='304' font-size='10' class='d'>Every D3-D7 action carries an owner, a date and a verification method.</text>
</svg>
