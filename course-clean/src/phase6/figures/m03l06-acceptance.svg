<svg viewBox='0 0 960 330' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Stencil acceptance checklist with the issued specification values: foil 0.120 mm, aperture 0.400 mm, area ratio at least 0.66, wall taper at least 85 degrees, tension 25-35 N/cm, step depth 0.050 mm; plus cleaning and lifetime tracking'><style>text{font-family:'IBM Plex Mono',monospace;fill:#e2e8f0}.d{fill:#94a3b8}.t{fill:#53d1cc}.r{fill:#f44336}.o{fill:#ff9800}</style>
<text x='20' y='24' font-size='13' class='t'>INCOMING STENCIL — check reported value AND tolerance band against the issued spec</text>
<rect x='20' y='46' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='58' font-size='11' class='d'>foil thickness</text><text x='230' y='58' font-size='11'>0.120 ± 0.010 mm</text>
<rect x='20' y='70' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='82' font-size='11' class='d'>aperture width</text><text x='230' y='82' font-size='11'>0.400 ± 0.025 mm</text>
<rect x='20' y='94' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='106' font-size='11' class='d'>area ratio</text><text x='230' y='106' font-size='11'>≥ 0.66 (issued spec, IPC-7525C guidance)</text>
<rect x='20' y='118' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='130' font-size='11' class='d'>wall taper</text><text x='230' y='130' font-size='11'>≥ 85°</text>
<rect x='20' y='142' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='154' font-size='11' class='d'>tension</text><text x='230' y='154' font-size='11'>25-35 N/cm</text>
<rect x='20' y='166' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='178' font-size='11' class='d'>step depth</text><text x='230' y='178' font-size='11'>0.050 ± 0.010 mm</text>
<rect x='20' y='190' width='14' height='14' fill='none' stroke='#53d1cc'/><text x='44' y='202' font-size='11' class='d'>registration, flatness</text><text x='230' y='202' font-size='11'>per drawing</text>
<rect x='520' y='40' width='360' height='1' fill='#334155'/>
<text x='520' y='64' font-size='12' class='t'>CLEANING REGIME</text>
<text x='520' y='84' font-size='11'>underside wipe: dry / wet / vacuum cycle per SPI trend</text>
<text x='520' y='102' font-size='11'>off-line wash after the run; inspect apertures</text>
<text x='520' y='120' font-size='11' class='d'>never scrape apertures; log every wash</text>
<text x='520' y='154' font-size='12' class='t'>LIFETIME TRACKING</text>
<text x='520' y='174' font-size='11'>print count · wash count · tension re-check · damage log</text>
<text x='520' y='192' font-size='11'>retire on tension loss, aperture wear, frame damage</text>
<text x='520' y='210' font-size='11' class='d'>release decision documented before use on the line</text>
<rect x='20' y='240' width='860' height='1' fill='#334155'/>
<text x='20' y='266' font-size='11'>Where the spec is silent: design reference from IPC-7525C and the paste/equipment datasheet, then record the accepted limit.</text>
<text x='20' y='290' font-size='11' class='d'>Acceptance = measurement report + tolerance band + area ratio recomputed from the measured foil and aperture, not the nominal.</text>
</svg>
