<svg viewBox='0 0 960 330' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Conformal coating families compared: acrylic, urethane, silicone, parylene and UV cure, with typical dry-film thickness, moisture barrier, rework and application method'><style>text{font-family:'IBM Plex Mono',monospace;fill:#e2e8f0}.d{fill:#94a3b8}.t{fill:#53d1cc}.r{fill:#f44336}.o{fill:#ff9800}</style>
<text x='20' y='24' font-size='13' class='t'>COATING FAMILIES — typical dry-film thickness (verify against datasheet and IPC-CC-830 qualification)</text>
<rect x='20' y='50' width='920' height='36' fill='rgba(83,209,204,.06)' stroke='#334155'/><text x='30' y='72' font-size='12' class='t'>acrylic</text><text x='150' y='72' font-size='11'>25-75 µm</text><text x='320' y='72' font-size='11'>moderate</text><text x='570' y='72' font-size='11'>easy (solvent/mech.)</text><text x='790' y='72' font-size='10' class='d'>brush/spray/dip/select.</text>
<rect x='20' y='90' width='920' height='36' fill='rgba(83,209,204,.06)' stroke='#334155'/><text x='30' y='112' font-size='12' class='t'>urethane</text><text x='150' y='112' font-size='11'>25-100 µm</text><text x='320' y='112' font-size='11'>good, chemical resistant</text><text x='570' y='112' font-size='11'>hard</text><text x='790' y='112' font-size='10' class='d'>spray, dip, selective</text>
<rect x='20' y='130' width='920' height='36' fill='rgba(83,209,204,.06)' stroke='#334155'/><text x='30' y='152' font-size='12' class='t'>silicone</text><text x='150' y='152' font-size='11'>25-100 µm</text><text x='320' y='152' font-size='11'>good, flexible</text><text x='570' y='152' font-size='11'>hard</text><text x='790' y='152' font-size='10' class='d'>spray, dip, selective</text>
<rect x='20' y='170' width='920' height='36' fill='rgba(83,209,204,.06)' stroke='#334155'/><text x='30' y='192' font-size='12' class='t'>parylene</text><text x='150' y='192' font-size='11'>1-25 µm (5-15 typ.)</text><text x='320' y='192' font-size='11'>excellent, pinhole-free</text><text x='570' y='192' font-size='11'>very hard</text><text x='790' y='192' font-size='10' class='d'>vapour deposition only</text>
<rect x='20' y='210' width='920' height='36' fill='rgba(83,209,204,.06)' stroke='#334155'/><text x='30' y='232' font-size='12' class='t'>UV cure</text><text x='150' y='232' font-size='11'>25-75 µm</text><text x='320' y='232' font-size='11'>good</text><text x='570' y='232' font-size='11'>moderate; shadow cure</text><text x='790' y='232' font-size='10' class='d'>selective, fast cure</text>
<text x='150' y='262' font-size='10' class='d'>thickness</text><text x='320' y='262' font-size='10' class='d'>moisture / chemical barrier</text><text x='570' y='262' font-size='10' class='d'>rework</text><text x='790' y='262' font-size='10' class='d'>application</text>
<text x='20' y='292' font-size='11'>select by: environment → board constraints (height, BTCs, test points, connectors, rework frequency) → chemistry → masking plan</text>
<text x='20' y='314' font-size='10' class='d'>Coverage/finish judged against IPC-A-610; rework per IPC-7711/7721.</text>
</svg>
