<svg viewBox='0 0 940 340' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Stencil aperture cross-section with area ratio and aspect ratio definitions; a thick foil with a narrow aperture gives low ratios and poor release'><style>text{font-family:'IBM Plex Mono',monospace;fill:#e2e8f0}.d{fill:#94a3b8}.t{fill:#53d1cc}.r{fill:#f44336}.o{fill:#ff9800}</style>
<text x='20' y='24' font-size='13' class='t'>GOOD RELEASE: thin foil, wide aperture</text>
<rect x='20' y='60' width='120' height='24' fill='#475569'/><rect x='260' y='60' width='120' height='24' fill='#475569'/>
<rect x='140' y='60' width='120' height='24' fill='rgba(83,209,204,.35)' stroke='#53d1cc'/>
<line x1='140' y1='100' x2='260' y2='100' stroke='#e2e8f0'/><text x='200' y='116' font-size='11' text-anchor='middle'>W (aperture width)</text>
<line x1='395' y1='60' x2='395' y2='84' stroke='#e2e8f0'/><text x='402' y='76' font-size='11'>t (foil)</text>
<text x='20' y='150' font-size='11'>area ratio = aperture area / wall area</text>
<text x='20' y='168' font-size='11'>           = L·W / (2·(L+W)·t)  → target ≥ 0.66</text>
<text x='20' y='192' font-size='11'>aspect ratio = W / t            → target ≥ 1.5</text>
<text x='20' y='216' font-size='10' class='d'>IPC-7525 release indicators; confirm against paste and equipment datasheet.</text>
<text x='480' y='24' font-size='13' class='r'>POOR RELEASE: thick foil, narrow aperture</text>
<rect x='480' y='50' width='140' height='44' fill='#475569'/><rect x='680' y='50' width='140' height='44' fill='#475569'/>
<rect x='620' y='50' width='60' height='44' fill='rgba(244,67,54,.3)' stroke='#f44336'/>
<line x1='620' y1='110' x2='680' y2='110' stroke='#e2e8f0'/><text x='650' y='126' font-size='11' text-anchor='middle'>small W</text>
<line x1='835' y1='50' x2='835' y2='94' stroke='#e2e8f0'/><text x='842' y='76' font-size='11'>big t</text>
<text x='480' y='150' font-size='11' class='r'>area ratio and aspect ratio both LOW</text>
<text x='480' y='168' font-size='11'>paste sticks to the walls: partial deposit,</text>
<text x='480' y='186' font-size='11'>not an over-thick one — the deposit is short</text>
<text x='480' y='216' font-size='10' class='d'>Fine pitch shrinks W faster than t: both ratios fall.</text>
<rect x='20' y='250' width='840' height='1' fill='#334155'/>
<text x='20' y='280' font-size='11'>Deposit volume = L·W·t × transfer efficiency; set the joint volume target first, then size the aperture.</text>
<text x='20' y='304' font-size='11' class='d'>Fixes: thinner foil, step-down pocket, larger or rounded aperture, polished or nano-coated walls, other paste.</text>
</svg>
